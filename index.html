;}, {&quot;id&quot;: 22, &quot;group&quot;: &quot;特許と実用新案&quot;, &quot;term&quot;: &quot;拡大先願&quot;, &quot;reading&quot;: &quot;かくだいせんがん&quot;, &quot;meaning&quot;: &quot;先の出願の当初明細書等にある発明が後に公開された場合、同一の後願発明を排除する仕組み。&quot;, &quot;point&quot;: &quot;先の請求項だけを見る制度ではない。同一発明者・出願人の例外に注意。&quot;, &quot;reference&quot;: &quot;第1章 特許法29条の2&quot;, &quot;url&quot;: &quot;https://laws.e-gov.go.jp/law/334AC0000000121&quot;}, {&quot;id&quot;: 23, &quot;group&quot;: &quot;特許と実用新案&quot;, &quot;term&quot;: &quot;新規性喪失の例外&quot;, &quot;reading&quot;: &quot;しんきせいそうしつのれいがい&quot;, &quot;meaning&quot;: &quot;自己の公開などについて、所定の条件で新規性喪失による不利益を救済する制度。&quot;, &quot;point&quot;: &quot;原則公開から1年以内の出願等が必要。出願日を公開日に戻す制度ではない。&quot;, &quot;reference&quot;: &quot;第1章 特許法30条&quot;, &quot;url&quot;: &quot;https://laws.e-gov.go.jp/law/334AC0000000121&quot;}, {&quot;id&quot;: 24, &quot;group&quot;: &quot;特許と実用新案&quot;, &quot;term&quot;: &quot;職務発明&quot;, &quot;reading&quot;: &quot;しょくむはつめい&quot;, &quot;meaning&quot;: &quot;使用者の業務範囲に属し、発明に至る行為が従業者の現在又は過去の職務に属する発明。&quot;, &quot;point&quot;: &quot;従業者の発明がすべて該当するわけではない。権利帰属と利益を確認する。&quot;, &quot;reference&quot;: &quot;第1章 特許法35条&quot;, &quot;url&quot;: &quot;https://laws.e-gov.go.jp/law/334AC0000000121&quot;}, {&quot;id&quot;: 25, &quot;group&quot;: &quot;特許と実用新案&quot;, &quot;term&quot;: &quot;特許請求の範囲と請求項&quot;, &quot;reading&quot;: &quot;とっきょせいきゅうのはんいとせいきゅうこう&quot;, &quot;meaning&quot;: &quot;特許を求める発明を記載する書類と、その書類を構成する個々の項。&quot;, &quot;point&quot;: &quot;特許発明の技術的範囲は請求項の記載に基づいて定める。&quot;, &quot;reference&quot;: &quot;第1章 特許法36条・70条&quot;, &quot;url&quot;: &quot;https://laws.e-gov.go.jp/law/334AC0000000121&quot;}, {&quot;id&quot;: 26, &quot;group&quot;: &quot;特許と実用新案&quot;, &quot;term&quot;: &quot;明細書&quot;, &quot;reading&quot;: &quot;めいさいしょ&quot;, &quot;meaning&quot;: &quot;発明の内容や実施方法などを説明する書類。&quot;, &quot;point&quot;: &quot;明細書に書いた内容の全部が、そのまま独占できるわけではない。&quot;, &quot;reference&quot;: &quot;第1章 特許法36条&quot;, &quot;url&quot;: &quot;https://laws.e-gov.go.jp/law/334 uot;, &quot;term&quot;: &quot;抵当権&quot;, &quot;reading&quot;: &quot;ていとうけん&quot;, &quot;meaning&quot;: &quot;占有を移さず、不動産等を担保として、その価値から優先弁済を受ける権利。&quot;, &quot;point&quot;: &quot;担保となる物の引渡しを要する質権と区別する。&quot;, &quot;reference&quot;: &quot;第3章 民法369条&quot;, &quot;url&quot;: &quot;https://laws.e-gov.go.jp/law/129AC0000000089&quot;}, {&quot;id&quot;: 84, &quot;group&quot;: &quot;民法&quot;, &quot;term&quot;: &quot;債務不履行&quot;, &quot;reading&quot;: &quot;さいむふりこう&quot;, &quot;meaning&quot;: &quot;債務の内容に従った履行をしないこと。&quot;, &quot;point&quot;: &quot;損害賠償の免責事由と、解除の要件を混ぜない。&quot;, &quot;reference&quot;: &quot;第3章 民法415条・541条・542条&quot;, &quot;url&quot;: &quot;https://laws.e-gov.go.jp/law/129AC0000000089&quot;}, {&quot;id&quot;: 85, &quot;group&quot;: &quot;民法&quot;, &quot;term&quot;: &quot;同時履行の抗弁&quot;, &quot;reading&quot;: &quot;どうじりこうのこうべん&quot;, &quot;meaning&quot;: &quot;双務契約で、相手が債務の履行を提供するまで自分の履行を拒むことができる主張。&quot;, &quot;point&quot;: &quot;債務が消えるわけではない。相手の債務が弁済期にないときは原則使えない。&quot;, &quot;reference&quot;: &quot;第3章 民法533条&quot;, &quot;url&quot;: &quot;https://laws.e-gov.go.jp/law/129AC0000000089&quot;}, {&quot;id&quot;: 86, &quot;group&quot;: &quot;民法&quot;, &quot;term&quot;: &quot;危険負担&quot;, &quot;reading&quot;: &quot;きけんふたん&quot;, &quot;meaning&quot;: &quot;双方に責任なく一方の債務が履行不能となった場合に、反対給付をどうするかという問題。&quot;, &quot;point&quot;: &quot;民法536条1項では、相手方は反対給付の履行を拒める。&quot;, &quot;reference&quot;: &quot;第3章 民法536条&quot;, &quot;url&quot;: &quot;https://laws.e-gov.go.jp/law/129AC0000000089&quot;}, {&quot;id&quot;: 87, &quot;group&quot;: &quot;民法&quot;, &quot;term&quot;: &quot;契約不適合&quot;, &quot;reading&quot;: &quot;けいやくふてきごう&quot;, &quot;meaning&quot;: &quot;引き渡された物の種類・品質・数量などが契約内容に適合しないこと。&quot;, &quot;point&quot;: &quot;追完、代金減額、損害賠償、解除はそれぞれ条件が違う。&quot;, &quot;reference&quot;: &quot;第3章 民法562〜566条&quot;, &quot;url&quot;: &quot;https://laws.e-gov.go.jp/law/129AC0000000089&quot;}, {&quot;id&quot;: 88, &quot;group&quot;: &quot;民法&quot;, &quot;term&quot;: &quot;追完&quot;, &quot;reading&quot;: &quot;ついかん&quot;, &quot;meaning&quot;: &quot;修理、代替物の引渡し、不足分の引渡しなどにより、契約に適合する履行を補うこと。&quot;, &quot;point&quot;: &quot;「追認」とは別の用語。売買の契約不適合への対応として覚える。&quot;, &quot;reference&quot;: &quot;第3章 民法562条&quot;, &quot;url&quot;: &quot;https://laws.e-gov.go.jp/law/129AC0000000089&quot;}, {&quot;id&quot;: 89, &quot;group&quot;: &quot;民法&quot;, &quot;term&quot;: &quot;相殺&quot;, &quot;reading&quot;: &quot;そうさい&quot;, &quot;meaning&quot;: &quot;互いに負う同種の債務を、対当額で消滅させること。&quot;, &quot;point&quot;: &quot;相殺の意思表示が必要。相殺禁止などの制限にも注意する。&quot;, &quot;reference&quot;: &quot;第3章 民法505条・506条等&quot;, &quot;url&quot;: &quot;https://laws.e-gov.go.jp/law/129AC0000000089&quot;}, {&quot;id&quot;: 90, &quot;group&quot;: &quot;民法&quot;, &quot;term&quot;: &quot;不法行為&quot;, &quot;reading&quot;: &quot;ふほうこうい&quot;, &quot;meaning&quot;: &quot;故意・過失による権利又は法律上保護される利益の侵害について、損害賠償責任を生じさせる制度。&quot;, &quot;point&quot;: &quot;侵害だけでなく損害・因果関係等も必要。特許侵害の損害賠償にもつながる。&quot;, &quot;reference&quot;: &quot;第3章 民法709条&quot;, &quot;url&quot;: &quot;https://laws.e-gov.go.jp/law/129AC0000000089&quot;}, {&quot;id&quot;: 91, &quot;group&quot;: &quot;民法&quot;, &quot;term&quot;: &quot;債権&quot;, &quot;reading&quot;: &quot;さいけん&quot;, &quot;meaning&quot;: &quot;特定の相手に、金銭の支払いや物の引渡しなどの行為を請求できる権利。&quot;, &quot;point&quot;: &quot;物を直接支配する物権と区別。請求できる人を債権者という。&quot;, &quot;reference&quot;: &quot;第3章 請求から答案を組み立てる&quot;, &quot;url&quot;: &quot;&quot;}, {&quot;id&quot;: 92, &quot;group&quot;: &quot;民法&quot;, &quot;term&quot;: &quot;債務&quot;, &quot;reading&quot;: &quot;さいむ&quot;, &quot;meaning&quot;: &quot;特定の相手に対して、支払いや引渡しなどをしなければならない義務。&quot;, &quot;point&quot;: &quot;義務を負う人が債務者。同じ人が代金の債権者・引渡しの債務者になることもある。&quot;, &quot;reference&quot;: &quot;第3章 請求から答案を組み立てる&quot;, &quot;url&quot;: &quot;&quot;}, {&quot;id&quot;: 93, &quot;group&quot;: &quot;民法&quot;, &quot;term&quot;: &quot;取得時効&quot;, &quot;reading&quot;: &quot;しゅとくじこう&quot;, &quot;meaning&quot;: &quot;一定の状態で長期間占有等を続けた者に、権利の取得を認める制度。&quot;, &quot;point&quot;: &quot;所有権では原則20年。占有開始時に善意無過失なら10年。所有の意思等も必要。&quot;, &quot;reference&quot;: &quot;第3章 民法162条&quot;, &quot;url&quot;: &quot;https://laws.e-gov.go.jp/law/129AC0000000089&quot;}, {&quot;id&quot;: 94, &quot;group&quot;: &quot;民法&quot;, &quot;term&quot;: &quot;留置権&quot;, &quot;reading&quot;: &quot;りゅうちけん&quot;, &quot;meaning&quot;: &quot;他人の物について生じた債権の弁済を受けるまで、その物を留置できる権利。&quot;, &quot;point&quot;: &quot;債権の弁済期到来等が必要。不法行為で占有を始めた場合などは除く。&quot;, &quot;reference&quot;: &quot;第3章 民法295条&quot;, &quot;url&quot;: &quot;https://laws.e-gov.go.jp/law/129AC0000000089&quot;}, {&quot;id&quot;: 95, &quot;group&quot;: &quot;民法&quot;, &quot;term&quot;: &quot;債権譲渡&quot;, &quot;reading&quot;: &quot;さいけんじょうと&quot;, &quot;meaning&quot;: &quot;債権を、元の債権者から別の者へ移すこと。&quot;, &quot;point&quot;: &quot;債務者への対抗には原則譲渡人の通知又は債務者の承諾。他の第三者には確定日付も必要。&quot;, &quot;reference&quot;: &quot;第3章 民法466条・467条&quot;, &quot;url&quot;: &quot;https://laws.e-gov.go.jp/law/129AC0000000089&quot;}, {&quot;id&quot;: 96, &quot;group&quot;: &quot;民法&quot;, &quot;term&quot;: &quot;保証&quot;, &quot;reading&quot;: &quot;ほしょう&quot;, &quot;meaning&quot;: &quot;主たる債務者が履行しないとき、保証人が履行責任を負う仕組み。&quot;, &quot;point&quot;: &quot;保証契約には書面又は所定の電磁的記録が必要。通常保証と連帯保証を区別する。&quot;, &quot;reference&quot;: &quot;第3章 民法446条・452〜454条&quot;, &quot;url&quot;: &quot;https://laws.e-gov.go.jp/law/129AC0000000089&quot;}, {&quot;id&quot;: 97, &quot;group&quot;: &quot;民法&quot;, &quot;term&quot;: &quot;請負&quot;, &quot;reading&quot;: &quot;うけおい&quot;, &quot;meaning&quot;: &quot;一方が仕事を完成させ、相手がその結果に報酬を支払う契約。&quot;, &quot;point&quot;: &quot;中心は仕事の完成。事務処理を中心とする委任・準委任と区別する。&quot;, &quot;reference&quot;: &quot;第3章 民法632条&quot;, &quot;url&quot;: &quot;https://laws.e-gov.go.jp/law/129AC0000000089&quot;}, {&quot;id&quot;: 98, &quot;group&quot;: &quot;民法&quot;, &quot;term&quot;: &quot;委任と準委任&quot;, &quot;reading&quot;: &quot;いにんとじゅんいにん&quot;, &quot;meaning&quot;: &quot;委任は法律行為の処理、準委任は法律行為ではない事務の処理を委託すること。&quot;, &quot;point&quot;: &quot;原則として善管注意義務を負う。仕事の完成を約する請負と区別する。&quot;, &quot;reference&q   &lt;script&gt;
  (() =&gt; {
    const root = document.getElementById(&#x27;benrishi-cards-2027&#x27;);
    const data = JSON.parse(document.getElementById(&#x27;benrishi-card-data-2027&#x27;).textContent);
    const el = role =&gt; root.querySelector(&#x27;[data-role=&quot;&#x27; + role + &#x27;&quot;]&#x27;);
    const groups = [...new Set(data.map(c =&gt; c.group))];
    const choices = { starter: data.slice(0, 20), all: data };
    groups.forEach((group, i) =&gt; {
      const key = &#x27;group-&#x27; + i;
      choices[key] = data.filter(c =&gt; c.group === group);
      const option = document.createElement(&#x27;option&#x27;);
      option.value = key;
      option.textContent = group + &#x27; · &#x27; + choices[key].length + &#x27;枚&#x27;;
      el(&#x27;deck&#x27;).appendChild(option);
    });
    let deck = &#x27;starter&#x27;;
    let index = 0;
    let flipped = false;
    function restore(snapshot) {
      const state = snapshot &amp;&amp; (snapshot.privateContent || snapshot);
      if (!state || state.version !== 1 || !Object.hasOwn(choices, state.deck)) return;
      deck = state.deck;
      index = Number.isInteger(state.index) ? Math.max(0, Math.min(choices[deck].length - 1, state.index)) : 0;
      flipped = state.flipped === true;
    }
    function draw() {
      const cards = choices[deck];
      const card = cards[index];
      el(&#x27;deck&#x27;).value = deck;
      el(&#x27;chapter&#x27;).textContent = card.group + &#x27; · No.&#x27; + String(card.id).padStart(3, &#x27;0&#x27;);
      el(&#x27;position&#x27;).textContent = (index + 1) + &#x27; / &#x27; + cards.length;
      el(&#x27;term&#x27;).textContent = card.term;
      el(&#x27;reading&#x27;).textContent = card.reading;
      el(&#x27;meaning&#x27;).textContent = card.meaning;
      el(&#x27;point&#x27;).textContent = card.point;
      el(&#x27;reference&#x27;).textContent = &#x27;教科書の戻り先：&#x27; + card.reference;
      el(&#x27;source&#x27;).hidden = !card.url;
      if (card.url) el(&#x27;source&#x27;).href = card.url;
      else el(&#x27;source&#x27;).removeAttribute(&#x27;href&#x27;);
      el(&#x27;answer&#x27;).hidden = !flipped;
      el(&#x27;flip&#x27;).textContent = flipped ? &#x27;答えを隠す&#x27; : &#x27;答えを見る&#x27;;
      el(&#x27;flip&#x27;).setAttribute(&#x27;aria-expanded&#x27;, String(flipped));
      el(&#x27;prev&#x27;).disabled = index === 0;
      el(&#x27;next&#x27;).textContent = index === cards.length - 1 ? &#x27;最初に戻る&#x27; : &#x27;次へ&#x27;;
    }
    function save() {
      const card = choices[deck][index];
      if (typeof window.openai?.setWidgetState === &#x27;function&#x27;) {
        Promise.resolve(window.openai.setWidgetState({
          modelContent: {教材: &#x27;弁理士試験 基本用語120枚&#x27;, 用語: card.term, カード番号: card.id, 範囲: el(&#x27;deck&#x27;).selectedOptions[0].textContent},
          privateContent: {version: 1, deck, index, flipped}
        })).catch(() =&gt; {});
      }
    }
    function commit() { draw(); save(); }
    el(&#x27;deck&#x27;).addEventListener(&#x27;change&#x27;, () =&gt; { deck = el(&#x27;deck&#x27;).value; index = 0; flipped = false; commit(); });
    el(&#x27;flip&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { flipped = !flipped; commit(); });
    el(&#x27;next&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { index = (index + 1) % choices[deck].length; flipped = false; commit(); });
    el(&#x27;prev&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { index = Math.max(0, index - 1); flipped = false; commit(); });
    restore(window.openai?.widgetState);
    window.addEventListener(&#x27;openai:set_globals&#x27;, event =&gt; {
      const globals = event.detail?.globals;
      if (globals &amp;&amp; Object.hasOwn(globals, &#x27;widgetState&#x27;)) { restore(globals.widgetState); draw(); }
    });
    draw();
  })();
  &lt;/script&gt;
